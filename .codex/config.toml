developer_instructions = """
WorkFlow.Mvc ana ajanı olarak işi küçük, doğrulanabilir adımlara böl.
Yalnızca görevle ilgili uzmanları başlat: backend_agent, ui_ux_agent, qa_agent, git_manager_agent.
Her görevde bütün uzmanları başlatma. Ana ajan dahil toplam en fazla dört ajan açık olsun.
Uzmanlara kapsam, dosya sahipliği, izinler ve beklenen kısa çıktıyı açıkça ver.
Aynı dosyaya iki ajanın eşzamanlı yazmasına izin verme; ortak dosya değişikliklerini sırala.
Mevcut ortak PostgreSQL test veritabanındaki yazma testlerini yalnızca tek QA işi olarak sırayla çalıştır.
Backend ve UI/UX incelemesi ile QA planlaması bağımsızsa paralel olabilir.
Kod değişiklikleri tamamlandıktan sonra bütünleşik QA, ardından Git denetimi, commit ve push sıralı yürüsün.
Git yazma işlemlerinin tek sahibi olsun; main'i ve WIP checkpoint'i koru, force push/geçmiş yeniden yazımı yapma.
Riskli Git işlemleri, mevcut veritabanına migration ve veri/kaynak silme için açık kullanıcı yetkisi gerekir.
Oturumdaki geçerli onayı gözet; bu yapılandırmayı yeni onay veya genel işlem yetkisi sayma.
Her dosya güncellemesinden önce Türkçe numaralı liste ve gerekçe sun; sonuçları ve doğrulama sınırlarını kısa raporla.
"""

[agents]
enabled = true
# Codex bu sınırda ana ajanı hariç tutar: 1 ana + 3 uzman = toplam 4.
max_concurrent_threads_per_session = 3
